workflows:

  # ─────────────────────────────────────────────────────────────────────────
  #  SpeedUp Android — Release AAB
  #  • No Play Store upload — AAB is available as a build artifact to download
  #  • All credentials are embedded — no Codemagic environment setup needed
  #  • Trigger: push to main  OR  run manually from Codemagic dashboard
  # ─────────────────────────────────────────────────────────────────────────
  android-release:
    name: SpeedUp Android — Release AAB
    max_build_duration: 60
    instance_type: linux_x1

    environment:
      vars:
        # ── App ───────────────────────────────────────────────────────────────
        PACKAGE_NAME: "com.speedupp.app"
        APP_NAME: "SpeedUp"

        # ── Vite build vars ───────────────────────────────────────────────────
        BASE_PATH: "/"
        PORT: "3000"
        NODE_ENV: "production"

        # ── Supabase ──────────────────────────────────────────────────────────
        VITE_SUPABASE_URL: "https://cgadnsuyezixjdrjkbvb.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnYWRuc3V5ZXppeGpkcmprYnZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjI0OTgsImV4cCI6MjA5NTM5ODQ5OH0.kePPhpHopt1Ks5MjnjTQLyAPXwsGnAVGx8Xv2HMBuGY"
        VITE_SUPABASE_PROJECT_ID: "cgadnsuyezixjdrjkbvb"

        # ── Android signing ───────────────────────────────────────────────────
        # PKCS12 keystore generated for com.speedupp.app
        # Alias: speedup-key  |  Valid: 27 years from 2024
        CM_KEYSTORE_PASSWORD: "SpeedUpp@2024!"
        CM_KEY_ALIAS: "speedup-key"
        CM_KEY_PASSWORD: "SpeedUpp@2024!"
        CM_KEYSTORE_BASE64: ""

      node: 20.15.1
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:

      - name: Install pnpm
        script: |
          npm install -g pnpm@latest

      - name: Install Node dependencies
        script: |
          cd artifacts/food-ordering
          pnpm install --frozen-lockfile

      - name: Build web assets
        script: |
          cd artifacts/food-ordering
          pnpm run build:cap

      - name: Generate Android icons from owl icon
        script: |
          cd artifacts/food-ordering
          # Generates all mipmap-* sizes from resources/icon.png (1024px source)
          npx @capacitor/assets@latest generate \
            --iconBackgroundColor '#ef4444' \
            --iconBackgroundColorDark '#ef4444' \
            --splashBackgroundColor '#ffffff' \
            --splashBackgroundColorDark '#121212' \
            --android

      - name: Add Android platform (first time only)
        script: |
          cd artifacts/food-ordering
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets → Android
        script: |
          cd artifacts/food-ordering
          npx cap sync android

      - name: Set versionCode and versionName
        script: |
          BUILD_NUM=${CM_BUILD_NUMBER:-1}
          VERSION="1.0.${BUILD_NUM}"
          GRADLE="artifacts/food-ordering/android/app/build.gradle"
          sed -i "s/versionCode [0-9]*/versionCode ${BUILD_NUM}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" "$GRADLE"
          echo "→ versionName: ${VERSION}  versionCode: ${BUILD_NUM}"

      - name: Decode keystore
        script: |
          echo "$CM_KEYSTORE_BASE64" | base64 --decode > /tmp/speedup-release.keystore
          echo "Keystore ready ($(wc -c < /tmp/speedup-release.keystore) bytes)"

      - name: Build signed release AAB
        script: |
          cd artifacts/food-ordering/android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/speedup-release.keystore \
            -Pandroid.injected.signing.store.password="${CM_KEYSTORE_PASSWORD}" \
            -Pandroid.injected.signing.key.alias="${CM_KEY_ALIAS}" \
            -Pandroid.injected.signing.key.password="${CM_KEY_PASSWORD}" \
            --stacktrace

      - name: Confirm AAB produced
        script: |
          AAB="artifacts/food-ordering/android/app/build/outputs/bundle/release/app-release.aab"
          ls -lh "$AAB"

    # ── Download these from the Codemagic build page ──────────────────────────
    artifacts:
      - artifacts/food-ordering/android/app/build/outputs/bundle/release/app-release.aab
      - artifacts/food-ordering/android/app/build/outputs/mapping/release/mapping.txt

    # No publishing block — download the AAB manually and upload to Play Console
