    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, hsl(0, 70%, 10%) 0%, hsl(0, 60%, 22%) 100%);
        transition: opacity 0.4s ease-out;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        font-size: 4rem;
        animation: pulse-bowl 1.5s ease-in-out infinite;
      }
      #splash .title {
        margin-top: 1rem;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, hsl(0, 78%, 50%), hsl(38, 90%, 50%));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #splash .subtitle {
        margin-top: 0.5rem;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.875rem;
        color: rgba(255,255,255,0.5);
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      #splash .loader {
        margin-top: 2rem;
        width: 40px;
        height: 40px;
        border: 3px solid hsla(0, 78%, 50%, 0.2);
        border-top-color: hsl(0, 78%, 50%);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-bowl {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
