<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/owl-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SpeedUp — Food, Errands & Delivery</title>
    <meta name="description" content="SpeedUp by Genesis Holdings: Order food, run errands, send parcels, packages and get pharmacy deliveries — all with live GPS tracking. Available worldwide.">
    <meta name="author" content="Genesis Holdings Inc, USA" />
    <meta name="theme-color" content="#E8590C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpeedUp" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="SpeedUp — Fast Delivery & Services, Anywhere" />
    <meta property="og:description" content="Order food, run errands, send parcels and get pharmacy deliveries with live GPS tracking. A Genesis Holdings product." />
    <meta property="og:image" content="/owl-icon.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SpeedUpApp" />
    <meta name="twitter:title" content="SpeedUp — Fast Delivery & Services, Anywhere" />
    <meta name="twitter:description" content="Order food, run errands, send parcels and get pharmacy deliveries with live GPS tracking. A Genesis Holdings product." />
    <meta name="twitter:image" content="/owl-icon.png">

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, hsl(0, 70%, 10%) 0%, hsl(0, 60%, 22%) 100%);
        transition: opacity 0.4s ease-out;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash .loader {
        margin-top: 2rem;
        width: 40px;
        height: 40px;
        border: 3px solid hsla(0, 78%, 50%, 0.2);
        border-top-color: hsl(0, 78%, 50%);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #splash .title {
        margin-top: 1rem;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        background: linear-gradient(135deg, hsl(0, 78%, 65%), hsl(38, 90%, 60%));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      #splash .subtitle {
        margin-top: 0.375rem;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.75rem;
        color: rgba(255,255,255,0.4);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <div id="splash">
      <img src="/owl-icon.png" alt="SpeedUp" style="width:72px;height:72px;border-radius:16px;object-fit:cover;">
      <div class="title">SpeedUp</div>
      <div class="subtitle">A Genesis Holdings Product</div>
      <div class="loader"></div>
    </div>

    <div id="root"></div>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
